<div class="container-fluid">
  <div class="row vh-100 p-lg-5 p-md-3 p-sm-1 p-1">
    <!--left side-->
    <div class="col-lg-9 col-md-7 col-sm-12 col-12 p-0 text-center align-content-center">
      <div>
        <h1><strong>Nice to see you again!</strong></h1>
        <h1>WELCOME BACK!</h1>
      </div>

      <div>
        <h3><b>INSYTE</b></h3>
        <span>{{ version }}</span>
      </div>
    </div>

    <!--right side-->
    <div class="col-lg-3 col-md-5 col-sm-12 col-12 align-content-center">
      <div class="position-relative text-center">
        <img src="assets/logo/logo.jpg" alt="Logo">
        <div>
          <strong><b>SING IN</b></strong>
          <p class="small">Enter your username and password to access the account.</p>
        </div>
        <form [formGroup]="signInForm" (ngSubmit)="login()" class="text-start">
          <div>
            <div class="col-lg-12 col-md-12 col-sm-12">
              <mat-label>Enter your username</mat-label>
              <mat-form-field appearance="outline" class="w-100">
                <input aria-label="Username" autofocus formControlName="username" matInput placeholder="Username"
                       class="px-1">
              </mat-form-field>
            </div>

            <div class="col-lg-12 col-md-12 col-sm-12">
              <mat-label>Enter your password</mat-label>
              <mat-form-field appearance="outline" class="w-100">
                <input [type]="hide ? 'password' : 'text'" aria-label="Password" formControlName="password" matInput
                       placeholder="Password" class="px-1">
                <button (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide"
                        mat-icon-button matSuffix>
                  <mat-icon>
                    {{ hide ? 'visibility' : 'visibility_off' }}
                  </mat-icon>
                </button>
              </mat-form-field>
            </div>


            <div class="col-lg-12 col-md-12 col-sm-12 d-flex justify-content-between align-items-center">
              <label>
                <mat-checkbox>Remember me</mat-checkbox>
              </label>
              <label (click)="forgetPassword()">Forget Password ?</label>
            </div>

            <div class="col-lg-12 col-md-12 col-sm-12 mt-3">
              <button (click)="login()" [disabled]="signInForm.invalid" type="button" class="w-100 btn btn-primary">
                LOGIN
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
