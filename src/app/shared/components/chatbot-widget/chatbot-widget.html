<div class="chatbot-container">
  <div class="chat-window" *ngIf="isOpen">
    <div class="chat-header">
      <div>
        <h4>Insyte Assistant</h4>
        <span>AI support chatbot</span>
      </div>

      <button type="button" class="close-btn" (click)="toggleChat()">×</button>
    </div>

    <div class="chat-body" #chatBody>
      <div
        *ngFor="let msg of messages"
        class="message-row"
        [class.user-row]="msg.sender === 'user'"
        [class.bot-row]="msg.sender === 'bot'">

        <div
          class="message-bubble"
          [class.user-bubble]="msg.sender === 'user'"
          [class.bot-bubble]="msg.sender === 'bot'">

          <p>{{ msg.text }}</p>

          <small *ngIf="msg.sender === 'bot' && msg.confidenceScore !== undefined">
            Confidence: {{ msg.confidenceScore }}%
          </small>
        </div>
      </div>

      <div class="message-row bot-row" *ngIf="loading">
        <div class="message-bubble bot-bubble">
          <p>Typing...</p>
        </div>
      </div>
    </div>

    <div class="chat-footer">
      <input
        type="text"
        [(ngModel)]="message"
        placeholder="Ask something..."
        (keydown.enter)="onEnter($event)"
        [disabled]="loading"/>

      <button type="button" (click)="sendMessage()" [disabled]="loading || !message.trim()">
        Send
      </button>
    </div>
  </div>

  <button type="button" class="chat-toggle" (click)="toggleChat()">
    {{ isOpen ? '×' : '💬' }}
  </button>
</div>
